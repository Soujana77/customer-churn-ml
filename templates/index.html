<!DOCTYPE html>
<html>
<head>
    <title>Customer Churn Prediction</title>
    <style>
        body {
            font-family: Arial;
            background-color: #f4f6f8;
            text-align: center;
        }
        .container {
            background: white;
            padding: 20px;
            margin: 50px auto;
            width: 400px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }
        input, select {
            width: 90%;
            padding: 8px;
            margin: 8px 0;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px;
            border: none;
            width: 95%;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Customer Churn Prediction</h2>

    <form action="/predict" method="post">

        <label>Tenure (months):</label>
        <input type="number" name="tenure" required>

        <label>Monthly Charges:</label>
        <input type="number" step="0.01" name="monthly" required>

        <label>Contract Type:</label>
        <select name="contract">
            <option value="0">Month-to-month</option>
            <option value="1">One year</option>
            <option value="2">Two year</option>
        </select>

        <label>Internet Service:</label>
        <select name="internet">
            <option value="0">DSL</option>
            <option value="1">Fiber optic</option>
            <option value="2">No Internet</option>
        </select>

        <button type="submit">Predict</button>
    </form>

    <div class="result">
        {{ prediction_text }}
    </div>
    <p style="color: gray;">{{ reasons }}</p>
</div>

</body>
</html>
