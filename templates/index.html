<!DOCTYPE html>
<html>
<head>
    <title>Customer Churn Analyzer</title>

    <style>
        body {
            font-family: Arial;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            text-align: center;
        }

        .container {
            background: white;
            padding: 25px;
            margin: 50px auto;
            width: 420px;
            border-radius: 12px;
            box-shadow: 0px 5px 15px rgba(0,0,0,0.3);
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }

        small {
            color: gray;
        }

        input, select {
            width: 90%;
            padding: 10px;
            margin-top: 5px;
        }

        button {
            margin-top: 20px;
            padding: 12px;
            width: 95%;
            background: #4facfe;
            color: white;
            border: none;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #007bff;
        }

        .result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }

        .info {
            margin-top: 10px;
            font-size: 14px;
            color: gray;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Customer Churn Analyzer</h2>

    <form action="/predict" method="post">

        <label>Tenure (months)</label>
        <small>How long customer has used service</small>
        <input type="number" name="tenure" required>

        <label>Select Plan</label>
        <small>Choose subscription plan</small>
        <select name="plan">
            <option value="30">Basic - ₹30</option>
            <option value="50">Standard - ₹50</option>
            <option value="80">Premium - ₹80</option>
            <option value="100">Ultimate - ₹100</option>
        </select>

        <label>Contract Type</label>
        <select name="contract">
            <option value="0">Month-to-month</option>
            <option value="1">One year</option>
            <option value="2">Two year</option>
        </select>

        <label>Internet Service</label>
        <select name="internet">
            <option value="0">DSL</option>
            <option value="1">Fiber optic</option>
            <option value="2">No Internet</option>
        </select>

        <button type="submit">Analyze</button>
    </form>

    <div class="result">
        {{ prediction_text }}
    </div>

    <div class="info">
        {{ reasons }}
    </div>

    <div class="info">
        {{ suggestions }}
    </div>

</div>

</body>
</html>
